- title: Research Interests
  type: list
  contents:
    - "I am broadly interested in the intersection of physics and computation, particularly quantum physics, cavity QED, and photonics. I want to understand physical systems through simulation and modeling, and to develop hands-on experimental skills by helping design, build, and characterize them. I am also interested in developing and applying AI/ML methods to accelerate physical simulations, analyze experimental data, and connect theoretical models with experimental observables."

