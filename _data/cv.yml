- title: Projects
  type: time_table
  contents:
    - title: "Coupled Flow Matching (CPFM): Controllable Dimensionality Reduction & Reconstruction"
      institution: Ann Arbor, USA
      year: May. 2025 - Oct. 2025
      description:
        - "Paper: https://arxiv.org/abs/2510.23015"
        - CPFM learns coupled continuous flows for data x and low-dimensional embeddings y to enable both p(y|x) sampling and p(x|y) reconstruction.
        - Extended Gromov-Wasserstein OT with a kernelized quadratic objective to encode semantic priors; derived an alternating minimization with entropic Sinkhorn and O(n^2) per-iteration complexity.
        - Implemented Dual Conditional Flow Matching (DCFM) with a shared drift network, role flagging, and mute-masking to jointly learn bidirectional flows with 2D embeddings and high-fidelity reconstructions.
        - Evaluated on MNIST, CIFAR-10, TinyImageNet, AFHQ, and QM9; obtained semantically rich 2D embeddings and stronger reconstructions than VAE/DiffAE/Info-Diffusion under extreme compression.
    - title: "Curie: Automate Rigorous Scientific Experimentation"
      institution: Ann Arbor, USA
      year: Mar. 2025 - Aug. 2025
      description:
