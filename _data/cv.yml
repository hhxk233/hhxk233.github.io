- title: Research Experience
  type: time_table
  contents:
    - title: Undergraduate Research Assistant
      institution: University of Michigan, Department of Radiation Oncology, Ann Arbor, USA
      year: May. 2025 - May. 2026
      description:
        - "Advisor: Lise Wei"
        - title: "Equating the Biologically Effective Dose of SBRT and 90Y SIRT: A Unified Voxel-Level Liver Function Dose-Response"
          contents:
            - Built a voxel-level pipeline aligning DGAE-MRI k1(x) maps to CT-based dosimetry; defined parenchyma masks and dose binning to quantify the percent change in k1 post-therapy.
            - Harmonized modalities onto a common biological scale using LQ-based EQD2 for SBRT and protraction-aware BED (Lea-Catcheside kernel) for SIRT.
            - Modeled subvoxel SIRT nonuniformity via EUD and fit mixed-effects 4-parameter logistic dose-response with covariates; calibrated repair rate mu and micro-dose CV c by aligning SBRT/SIRT curves with bootstrap uncertainty.
        - title: "ReMasker-Cox: Survival-Guided Masked Autoencoder for Missing Data Imputation"
          contents:
            - Extended a masked autoencoder (ReMasker) to jointly optimize imputation and survival consistency by adding a CoxPH loss (PyCox) to the reconstruction objective.
            - Implemented a training workflow with random masking, joint loss weighting, and evaluation focused on preserving risk structure for clinical tabular data.

    - title: Undergraduate Research Assistant
      institution: University of Michigan, Deng Research Lab, Ann Arbor, USA
      year: Sep. 2024 - Aug. 2025
      description:
        - "Advisor: Chulwon Lee; Faculty Instructor: Hui Deng"
        - title: Loss-Induced Synthetic Magnetic Field
          contents:
            - Designed and simulated rotationally asymmetric Si ring-resonator arrays to engineer loss-induced synthetic magnetic fields; observed two-sided non-Hermitian skin-effect localization in 3D FDTD.
            - Built a non-Hermitian tight-binding model; eigen-analysis identified zero net loop phase as a barrier to the skin effect; proposed phase/loss asymmetry and distance-offset remedies and validated designs in simulation.
            - "Tools: ANSYS Lumerical FDTD, MATLAB; GreatLake HPC."
        - title: Non-Hermitian Exciton-Polariton Transport beyond Lorentz Reciprocity Theorem
          contents:
            - Fall 2024 - Winter 2025 Undergraduate Research Opportunity Program
            - Using Ansys Lumerical to simulate a nanobeam cavity integrated with a grating coupler.
            - Exfoliating MoSe2 to make monolayer samples.
            - 'Manuscript submitted: Lee, C., Lee, J.H., Zhang, K., Wang, Y., Wang, Y., Lydick, N., Miao, J., Xin, X., Liu, Y., Sun, K., & Deng, H. "Harnessing nanophotonic edgemodes by engineering PT symmetry".'

