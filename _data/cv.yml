- title: Research Experience
  type: time_table
  contents:
    - title: Undergraduate Research Assistant
      institution: University of Michigan, Department of Radiation Oncology, Ann Arbor, USA
      year: May. 2025 - May. 2026
      description:
        - "Advisor: Lise Wei"
        - title: "Equating the Biologically Effective Dose of SBRT and 90Y SIRT"
          contents:
            - Modeled subvoxel SIRT nonuniformity via EUD and fit mixed-effects logistic dose-response with covariates; calibrated repair rate and micro-dose CV by aligning SBRT/SIRT curves with bootstrap uncertainty.
            - Co-authored the ASTRO 2026 conference abstract on a common biological dose scale for SBRT and SIRT; presented by Lise Wei in a Quick Pitch session.

    - title: Undergraduate Research Assistant
      institution: University of Michigan, Deng Research Lab, Ann Arbor, USA
      year: Sep. 2024 - Aug. 2025
      description:
        - "Advisor: Chulwon Lee; Faculty Instructor: Hui Deng"
        - title: Loss-Induced Synthetic Magnetic Field
          contents:
            - Designed and simulated rotationally asymmetric Si ring-resonator arrays to engineer loss-induced synthetic magnetic fields; observed two-sided non-Hermitian skin-effect localization in 3D FDTD.
            - Built a non-Hermitian tight-binding model; eigen-analysis identified zero net loop phase as a barrier to the skin effect; proposed phase/loss asymmetry and distance-offset remedies and validated designs in simulation.
            - "Tools: ANSYS Lumerical FDTD, MATLAB; GreatLake HPC."
        - title: Non-Hermitian Exciton-Polariton Transport beyond Lorentz Reciprocity Theorem
          contents:
            - Fall 2024 - Winter 2025 Undergraduate Research Opportunity Program
            - Using Ansys Lumerical to simulate a nanobeam cavity integrated with a grating coupler.
            - Exfoliating MoSe2 to make monolayer samples.
            - 'Manuscript submitted: Lee, C., Lee, J.H., Zhang, K., Wang, Y., Wang, Y., Lydick, N., Miao, J., Xin, X., Liu, Y., Sun, K., & Deng, H. "Harnessing nanophotonic edgemodes by engineering PT symmetry".'

    - title: Undergraduate Research Assistant
      institution: Shanghai Jiao Tong University, Laboratory of Ultrafast Integrated Systems (LUIS), Shanghai, China
      year: Aug. 2023 - May 2024
      description:
        - "Advisor: Xuyang Lu"
        - "Lab website: https://sites.gc.sjtu.edu.cn/xuyang-lu/"
        - title: "ENGR4903J Spring 2024: Chip-scale switch-mode wireless power transfer system based on parity-time method"
          contents:
            - Used the Kuramoto model and Adler equation to design an array of oscillators that can change the mutual phase difference by adjusting the coupling coefficient.
            - Learned the basic usage of Cadence and methods associated with analog circuits.
        - title: "ENGR4903J Fall 2023: Machine-learning method for mmWave-based voice and vital signal recognition"
          contents:
            - Implemented the VMD-HHT algorithm to better filter noise and reconstruct the received signal.
            - Learned the underlying principles of microcontroller systems and how signals are sent and received between microcontrollers.

