- title: Projects
  type: time_table
  contents:
    - title: Wearable Safety Inspection with Multimodal LLMs
      institution: Shanghai Jiao Tong University
      year: Aug. 2026
      description:
        - "Bachelor's team capstone: a wearable industrial-safety inspection prototype using Rokid AR glasses and compact vision-language models."
        - "Team: Yutong Wu, Mengru Wang, Yiyang Wang, Lidi Wang, and Yuheng Wang. Sponsor: Prof. Yifei Zhu. Supervisor: Prof. Qianli Chen."
        - Compared domain adaptation and image-case retrieval across construction, pipeline, and laboratory safety tasks; evaluated the integrated glasses-to-server prototype on the bench.
    - title: "Coupled Flow Matching (CPFM): Controllable Dimensionality Reduction & Reconstruction"
      institution: Ann Arbor, USA
      year: May. 2025 - Oct. 2025
      description:
        - "Paper: https://arxiv.org/abs/2510.23015"
        - CPFM learns coupled continuous flows for data x and low-dimensional embeddings y to enable both p(y|x) sampling and p(x|y) reconstruction.
        - Extended Gromov-Wasserstein OT with a kernelized quadratic objective to encode semantic priors; derived an alternating minimization with entropic Sinkhorn and O(n^2) per-iteration complexity, with an epsilon-scheduling scheme for stability.
    - title: Analogical Analyses of Epidemic Evolution from the Fluid Mechanics View
      institution: The 26th Shanghai Jiaotong University Student Innovation and Practice Programme Project, Shanghai, China
      year: Sep. 2022 - May. 2024
      description:
        - Modeled epidemic evolution using meta cellular automata written in Python and MATLAB.
        - Studied second-order phase transitions and links to epidemic outbreaks.

