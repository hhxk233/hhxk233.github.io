        { wavelength_nm: 620.2239, intensity: 5827.4 },
        { wavelength_nm: 623.6304, intensity: 9373.13 },
        { wavelength_nm: 624.3867, intensity: 8013.47 },
        { wavelength_nm: 624.9537, intensity: 7299.21 },
        { wavelength_nm: 625.7095, intensity: 10835.1 },
        { wavelength_nm: 626.465, intensity: 8582.13 },
        { wavelength_nm: 630.05, intensity: 11659.55 },
        { wavelength_nm: 630.9924, intensity: 12405.3 },
        { wavelength_nm: 631.5577, intensity: 11321.12 },
        { wavelength_nm: 632.4994, intensity: 13928.27 },
        { wavelength_nm: 633.8171, intensity: 11203.06 },
        { wavelength_nm: 638.1409, intensity: 15449.27 },
        { wavelength_nm: 639.0797, intensity: 14827.49 },
        { wavelength_nm: 639.8304, intensity: 15317.44 },
        { wavelength_nm: 640.7684, intensity: 14492.99 },
        { wavelength_nm: 645.452, intensity: 19707.3 },
        { wavelength_nm: 646.7615, intensity: 18436.19 },
        { wavelength_nm: 647.3225, intensity: 19691.56 },
        { wavelength_nm: 648.2571, intensity: 18656.57 },
        { wavelength_nm: 653.1102, intensity: 22088.17 },
        { wavelength_nm: 654.0421, intensity: 20094.93 },
        { wavelength_nm: 654.7874, intensity: 23620.98 },
        { wavelength_nm: 655.9048, intensity: 21261.75 },
        { wavelength_nm: 660.7396, intensity: 25145.92 },
        { wavelength_nm: 662.7817, intensity: 27111.62 },
        { wavelength_nm: 663.7092, intensity: 25628.0 },
        { wavelength_nm: 668.7104, intensity: 21979.95 },
        { wavelength_nm: 670.3747, intensity: 21686.77 },
        { wavelength_nm: 670.7444, intensity: 22499.41 },
        { wavelength_nm: 671.8529, intensity: 23217.61 },
        { wavelength_nm: 677.018, intensity: 12816.54 },
        { wavelength_nm: 677.7548, intensity: 13235.65 },
        { wavelength_nm: 679.2275, intensity: 14933.75 },
      ];
      const cv = document.getElementById("canvas");
      const ctx = cv.getContext("2d");
      const hud = document.getElementById("hud");
      const peaksDiv = document.getElementById("peaks");
      document.getElementById("peakcount").textContent = " (" + PEAKS.length + " peaks)";
      let showLabels = true,
        highlight = -1;
      const M = { l: 60, r: 20, t: 20, b: 50 };
      let xmin0 = Math.min(...WL),
        xmax0 = Math.max(...WL);
      let ymin0 = Math.min(...II),
        ymax0 = Math.max(...II);
      let xmin = xmin0,
        xmax = xmax0,
        ymin = ymin0,
        ymax = ymax0;
      function xpix(x) {
        return M.l + ((x - xmin) / (xmax - xmin)) * (cv.width - M.l - M.r);
      }
      function ypix(y) {
        return cv.height - M.b - ((y - ymin) / (ymax - ymin)) * (cv.height - M.t - M.b);
      }
      function xinv(p) {
        return xmin + ((p - M.l) / (cv.width - M.l - M.r)) * (xmax - xmin);
      }
      function yinv(p) {
        return ymin + ((cv.height - M.b - p) / (cv.height - M.t - M.b)) * (ymax - ymin);
      }
      function draw() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        // axes
        ctx.strokeStyle = "#888";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(M.l, M.t);
        ctx.lineTo(M.l, cv.height - M.b);
        ctx.lineTo(cv.width - M.r, cv.height - M.b);
        ctx.stroke();
        ctx.fillStyle = "#333";
        ctx.font = "12px system-ui";
        // ticks
        for (let k = 0; k <= 10; k++) {
          const x = xmin + (k * (xmax - xmin)) / 10;
          const px = xpix(x);
          ctx.beginPath();
          ctx.moveTo(px, cv.height - M.b);
          ctx.lineTo(px, cv.height - M.b + 5);
          ctx.stroke();
          ctx.fillText(x.toFixed(2), px - 18, cv.height - M.b + 18);
          const y = ymin + (k * (ymax - ymin)) / 10;
          const py = ypix(y);
          ctx.beginPath();
          ctx.moveTo(M.l, py);
          ctx.lineTo(M.l - 5, py);
          ctx.stroke();
          ctx.fillText(y.toFixed(0), 6, py + 4);
        }
        ctx.fillText("Wavelength (nm)", cv.width / 2 - 50, cv.height - 10);
        ctx.save();
        ctx.translate(14, cv.height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText("Intensity", 0, 0);
        ctx.restore();
        // spectrum
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 1;
        ctx.beginPath();
        let first = true;
        for (let i = 0; i < WL.length; i++) {
          const x = WL[i];
          if (x < xmin || x > xmax) continue;
          const px = xpix(x),
            py = ypix(II[i]);
          if (first) {
            ctx.moveTo(px, py);
            first = false;
          } else ctx.lineTo(px, py);
        }
        ctx.stroke();
        // peaks
        for (let i = 0; i < PEAKS.length; i++) {
          const p = PEAKS[i];
          if (p.wavelength_nm < xmin || p.wavelength_nm > xmax) continue;
          const px = xpix(p.wavelength_nm),
            py = ypix(p.intensity);
          ctx.fillStyle = i === highlight ? "#e02" : "#d22";
          ctx.beginPath();
          ctx.moveTo(px - 5, py - 8);
          ctx.lineTo(px + 5, py - 8);
          ctx.lineTo(px, py - 2);
          ctx.closePath();
          ctx.fill();
          if (showLabels) {
            ctx.fillStyle = "#333";
            ctx.save();
            ctx.translate(px, py - 12);
            ctx.rotate(-Math.PI / 2);
            ctx.font = (i === highlight ? "bold " : "") + "10px system-ui";
            ctx.fillText(p.wavelength_nm.toFixed(2), 0, 0);
            ctx.restore();
          }
        }
      }
      cv.addEventListener("mousemove", (e) => {
        const r = cv.getBoundingClientRect();
        const mx = (e.clientX - r.left) * (cv.width / r.width);
        const my = (e.clientY - r.top) * (cv.height / r.height);
        const x = xinv(mx),
          y = yinv(my);
        if (x >= xmin && x <= xmax && y >= ymin && y <= ymax) {
          // find nearest data point
          let best = 0,
            bd = 1e18;
          for (let i = 0; i < WL.length; i++) {
            const d = Math.abs(WL[i] - x);
            if (d < bd) {
              bd = d;
              best = i;
            }
          }
          hud.textContent = "λ = " + WL[best].toFixed(3) + " nm,  I = " + II[best].toFixed(2) + "   (cursor λ=" + x.toFixed(3) + ")";
        }
      });
      cv.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const r = cv.getBoundingClientRect();
          const mx = (e.clientX - r.left) * (cv.width / r.width);
          const x = xinv(mx);
          const f = e.deltaY > 0 ? 1.2 : 1 / 1.2;
          xmin = x - (x - xmin) * f;
          xmax = x + (xmax - x) * f;
          draw();
        },
        { passive: false }
      );
      let drag = null;
      cv.addEventListener("mousedown", (e) => {
        const r = cv.getBoundingClientRect();
        drag = { mx: (e.clientX - r.left) * (cv.width / r.width), xmin, xmax };
      });
      window.addEventListener("mouseup", () => (drag = null));
      cv.addEventListener("mousemove", (e) => {
        if (!drag) return;
        const r = cv.getBoundingClientRect();
        const mx = (e.clientX - r.left) * (cv.width / r.width);
        const dx = ((mx - drag.mx) / (cv.width - M.l - M.r)) * (drag.xmax - drag.xmin);
        xmin = drag.xmin - dx;
        xmax = drag.xmax - dx;
        draw();
      });
      function resetView() {
        xmin = xmin0;
        xmax = xmax0;
        ymin = ymin0;
        ymax = ymax0;
        draw();
      }
      function togglePeaks() {
        showLabels = !showLabels;
        draw();
      }
      // peak list
      function buildList() {
        let h = '<table style="width:100%"><tr><th>#</th><th>λ (nm)</th><th>I</th><th>prom</th></tr>';
        for (let i = 0; i < PEAKS.length; i++) {
          const p = PEAKS[i];
          h +=
            '<tr onclick="pick(' +
            i +
            ')" style="cursor:pointer"><td>' +
            (i + 1) +
            "</td><td>" +
            p.wavelength_nm.toFixed(3) +
            "</td><td>" +
            p.intensity.toFixed(2) +
            "</td><td>-</td></tr>";
        }
        h += "</table>";
        peaksDiv.innerHTML = h;
      }
      function pick(i) {
        highlight = i;
        const p = PEAKS[i];
        const w = xmax - xmin;
        xmin = p.wavelength_nm - w / 2;
        xmax = p.wavelength_nm + w / 2;
        draw();
      }
      buildList();
      draw();
    </script>
