name: Update portfolio data

on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio-data
  cancel-in-progress: false

jobs:
  refresh-portfolio-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate sanitized portfolio dataset
        env:
          PORTFOLIO_TRADES_CSV_B64: ${{ secrets.PORTFOLIO_TRADES_CSV_B64 }}
        run: node _scripts/generate-portfolio-data.mjs

      - name: Commit refreshed portfolio dataset
        run: |
          if git diff --quiet -- assets/json/portfolio-data.json; then
            echo "No portfolio data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/json/portfolio-data.json
          git commit -m "chore: refresh portfolio data"
          git push
